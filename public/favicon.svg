<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(244,63,94,0.4)" stroke-width="2"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(244,63,94,0.25)" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Play Symbol with Gradient & Glow -->
  <polygon points="26,20 45,32 26,44" fill="url(#playGrad)" filter="url(#glow)"/>
</svg>
